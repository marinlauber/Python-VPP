[project]
name = "python-vpp"
version = "1.0.0"
description = "3-DOF sailing yacht Velocity Prediction Program based on the ORC models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Marin Lauber", email = "marinlauber@gmail.com" },
    { name = "Otto Villani" },
    { name = "Thomas Dickson" },
]
keywords = ["VPP", "velocity prediction", "sailing", "yacht", "ORC", "naval architecture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/marinlauber/Python-VPP"
Documentation = "https://marinlauber.github.io/Python-VPP/"
Demo = "https://yacht-vpp.streamlit.app/"

[project.optional-dependencies]
api = ["flask", "gunicorn"]
demo = ["streamlit>=1.37", "plotly>=5.20"]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_vpp"]

[tool.hatch.build.targets.sdist]
include = ["src/python_vpp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
