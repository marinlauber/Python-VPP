[project]
name = "python-vpp"
version = "0.0.2"
description = "OOP Velocity Prediction Program"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Marin Lauber", email = "M.Lauber@soton.ac.uk" },
    { name = "Otto Villani" },
    { name = "Thomas Dickson" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "tqdm>=4.66",
    "flask",
    "streamlit>=1.37",
    "plotly>=6.6.0",
]

[project.optional-dependencies]
api = ["flask"]
demo = ["streamlit>=1.37"]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
